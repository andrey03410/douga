name: Production

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Look up published commit image
        id: existing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build Linux image
        if: steps.existing.outputs.published != 'true'
        run: |
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$IMAGE" .
      - name: Check container startup
        if: steps.existing.outputs.published != 'true'
        run: |
          set -euo pipefail
          docker run -d --name production-smoke -p 127.0.0.1:18791:3000 -e AUTH_SECRET=container-smoke-test-secret-not-used-in-production -e AUTH_TRUST_HOST=true -e DATABASE_URL=file:/app/storage/check.db "$IMAGE" \
            sh -ec 'node node_modules/prisma/build/index.js db push && exec node node_modules/next/dist/bin/next start -H 0.0.0.0'
          trap 'docker logs production-smoke; docker rm -f production-smoke' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18791/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Publish commit image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.existing.outputs.published != 'true'
        run: docker push "$IMAGE"

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.AUTO_DEPLOY == 'true'))
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    concurrency:
      group: production
      queue: max
    env:
      REGISTRY_TOKEN: ${{ github.token }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
    steps:
      - name: Activate image on VPS
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?}" "${DEPLOY_KEY:?}" "${DEPLOY_HOST_KEY:?}"
          main_sha=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit is already on main; run Production for that commit.' >&2
            exit 1
          fi
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$ssh_dir/known_hosts"
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -T -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -i "$ssh_dir/key" "root@$DEPLOY_HOST" "release $GITHUB_SHA $GITHUB_ACTOR"
